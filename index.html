<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Astronaut Braedon — Moon Base Mission</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#091329;color:white;font-family:system-ui,-apple-system,Arial;overflow:hidden}#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;gap:7px;padding:8px}header{width:min(100%,1100px);display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(16px,3vw,24px);margin:0}#status{font-size:clamp(12px,2vw,16px);color:#b9eaff}canvas{display:block;width:min(100%,1100px);max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);aspect-ratio:16/9;border:2px solid #5271a5;border-radius:12px;background:#13264c;touch-action:none}#controls{width:min(100%,1100px);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}.cluster{display:flex;gap:10px}.control{border:2px solid #83a7d5;background:#243b65;color:#fff;border-radius:16px;min-width:68px;height:58px;font-weight:800;font-size:22px;touch-action:none;user-select:none}.control:active,.control.pressed{background:#3977c6}#hint{font-size:12px;color:#bfd1ef;text-align:center}@media(min-width:900px){#controls{opacity:.85}.control{height:50px}}@media(max-height:550px){#wrap{gap:3px;padding:3px}canvas{max-height:calc(100vh - 95px);max-height:calc(100dvh - 95px)}#controls{min-height:42px}.control{height:40px;min-width:58px}#hint{display:none}}
</style></head><body><div id="wrap"><header><h1>🚀 Astronaut Braedon: Moon Base</h1><div id="status" aria-live="polite">Energy cells: 0 / 3</div></header><canvas id="game" width="960" height="540" aria-label="Side-scrolling platform game"></canvas><div id="controls"><div class="cluster"><button class="control" data-key="left" aria-label="Move left">◀</button><button class="control" data-key="right" aria-label="Move right">▶</button></div><div id="hint">Move: ← → / A D · Jump: Space / ↑ · Reach the ship after collecting 3 cells</div><div class="cluster"><button class="control" data-key="jump" aria-label="Jump">⤒ Jump</button><button class="control" data-key="restart" aria-label="Restart">↻</button></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status');const W=960,H=540,WORLD=2550,ground=455;const keys={left:false,right:false,jump:false};let player,items,won,camera,particles,frame,stars;const platforms=[{x:0,y:ground,w:610,h:100},{x:700,y:ground,w:490,h:100},{x:1280,y:ground,w:540,h:100},{x:1910,y:ground,w:640,h:100},{x:330,y:355,w:165,h:18},{x:800,y:360,w:180,h:18},{x:1120,y:312,w:165,h:18},{x:1460,y:360,w:170,h:18},{x:1730,y:315,w:170,h:18},{x:2020,y:355,w:155,h:18}];const hazards=[{x:560,y:ground-24,w:38,h:24},{x:1060,y:ground-24,w:45,h:24},{x:1660,y:ground-24,w:44,h:24}];const ship={x:2350,y:ground-155,w:135,h:155};function reset(){player={x:65,y:ground-68,w:42,h:68,vx:0,vy:0,onGround:false,face:1,invuln:0};items=[{x:410,y:315,got:false},{x:1200,y:267,got:false},{x:1800,y:272,got:false}];won=false;camera=0;particles=[];frame=0;status.textContent='Energy cells: 0 / 3';}reset();stars=Array.from({length:110},(_,i)=>({x:(i*271+43)%W,y:(i*103+27)%310,r:1+(i%3)*.5}));function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function respawn(){player.x=65;player.y=ground-68;player.vx=0;player.vy=0;player.invuln=65}function update(){frame++;if(won)return;const p=player;p.invuln=Math.max(0,p.invuln-1);const accel=.65,maxSpeed=5.1;if(keys.left){p.vx=Math.max(-maxSpeed,p.vx-accel);p.face=-1}else if(keys.right){p.vx=Math.min(maxSpeed,p.vx+accel);p.face=1}else p.vx*=.78;if(Math.abs(p.vx)<.1)p.vx=0;if(keys.jump&&p.onGround){p.vy=-13.4;p.onGround=false}p.vy=Math.min(p.vy+.65,15);const prevX=p.x,prevY=p.y;p.x=clamp(p.x+p.vx,0,WORLD-p.w);for(const plat of platforms){if(rects(p,plat)&&prevX+p.w<=plat.x){p.x=plat.x-p.w;p.vx=0}else if(rects(p,plat)&&prevX>=plat.x+plat.w){p.x=plat.x+plat.w;p.vx=0}}p.y+=p.vy;p.onGround=false;for(const plat of platforms){if(!rects(p,plat))continue;if(prevY+p.h<=plat.y+8&&p.vy>=0){p.y=plat.y-p.h;p.vy=0;p.onGround=true}else if(prevY>=plat.y+plat.h-8&&p.vy<0){p.y=plat.y+plat.h;p.vy=0}}if(p.y>H+130)respawn();if(p.invuln===0&&hazards.some(h=>rects(p,h)))respawn();for(const it of items){if(!it.got&&Math.hypot(p.x+p.w/2-it.x,p.y+p.h/2-it.y)<46){it.got=true;for(let i=0;i<15;i++)particles.push({x:it.x,y:it.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:30});status.textContent=`Energy cells: ${items.filter(a=>a.got).length} / 3`}}if(items.every(a=>a.got)&&rects(p,{x:ship.x+22,y:ship.y+80,w:100,h:75})){won=true;status.textContent='Mission complete! The spaceship is ready.'}for(const part of particles){part.x+=part.vx;part.y+=part.vy;part.life--}particles=particles.filter(q=>q.life>0);camera=clamp(p.x-W*.35,0,WORLD-W)}function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill()}function text(t,x,y,size=20,color='#fff',align='left'){ctx.font=`700 ${size}px system-ui`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}function draw(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#08132e');grad.addColorStop(1,'#344e8c');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.45+.4*Math.sin((frame+s.x)*.025)**2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#b7b5f4';ctx.beginPath();ctx.arc(790-camera*.035,100,56,0,7);ctx.fill();ctx.fillStyle='#757cc6';ctx.beginPath();ctx.arc(772-camera*.035,87,13,0,7);ctx.arc(816-camera*.035,116,9,0,7);ctx.fill();ctx.save();ctx.translate(-camera,0);for(let x=0;x<WORLD;x+=180){ctx.fillStyle='#40517c';ctx.beginPath();ctx.ellipse(x+50,ground+30,120,75,0,Math.PI,Math.PI*2);ctx.fill()}for(const plat of platforms){rounded(plat.x,plat.y,plat.w,plat.h,6,'#7d88b5');rounded(plat.x,plat.y,plat.w,12,5,'#c8cce8');ctx.fillStyle='#a5acd0';for(let x=plat.x+20;x<plat.x+plat.w-15;x+=58){ctx.beginPath();ctx.arc(x,plat.y+26,3,0,7);ctx.fill()}}for(const h of hazards){ctx.fillStyle='#ff6d8d';ctx.beginPath();for(let x=h.x;x<h.x+h.w;x+=14){ctx.moveTo(x,ground);ctx.lineTo(x+7,ground-24);ctx.lineTo(x+14,ground)}ctx.fill()}for(const it of items){if(it.got)continue;const y=it.y+Math.sin(frame*.06+it.x)*5;ctx.shadowBlur=20;ctx.shadowColor='#f5d45d';rounded(it.x-16,y-22,32,44,7,'#ffdc5d');ctx.shadowBlur=0;rounded(it.x-7,y-15,14,30,3,'#fff5b0');text('⚡',it.x,y+7,22,'#916a16','center')}drawShip();drawPlayer();for(const q of particles){ctx.globalAlpha=q.life/30;ctx.fillStyle='#ffe479';ctx.fillRect(q.x,q.y,5,5)}ctx.globalAlpha=1;ctx.restore();rounded(14,14,400,48,12,'#10264ddc');text('MISSION 1: Find 3 energy cells',27,45,21);if(player.x<240)text('Follow the glowing cells →',300,120,22,'#dcecff');if(player.x>2190&&!items.every(a=>a.got))text('Collect all 3 cells to launch!',W/2,90,24,'#ffde83','center');if(won){ctx.fillStyle='#08152adf';ctx.fillRect(0,0,W,H);rounded(175,120,610,280,22,'#1a3969');text('🚀 MISSION COMPLETE!',480,210,40,'#ffe68c','center');text('Braedon has powered up the spaceship!',480,268,23,'#fff','center');text('Next stop: the Alien Planet',480,306,21,'#9fe7ff','center');text('Press R or ↻ to play again',480,356,19,'#d8e7ff','center')}}function drawShip(){const ready=items.every(a=>a.got);ctx.save();ctx.translate(ship.x,ship.y);ctx.fillStyle='#a9c7e8';ctx.beginPath();ctx.moveTo(68,0);ctx.bezierCurveTo(120,40,121,102,115,150);ctx.lineTo(18,150);ctx.bezierCurveTo(12,100,16,39,68,0);ctx.fill();ctx.fillStyle='#4e79b8';ctx.beginPath();ctx.ellipse(68,66,30,36,0,0,7);ctx.fill();ctx.fillStyle='#a2ecff';ctx.beginPath();ctx.ellipse(68,66,22,27,0,0,7);ctx.fill();rounded(46,113,43,38,9,ready?'#61e3a0':'#f4ac65');ctx.fillStyle='#7a9dc9';ctx.beginPath();ctx.moveTo(18,113);ctx.lineTo(-8,154);ctx.lineTo(26,154);ctx.fill();ctx.beginPath();ctx.moveTo(114,113);ctx.lineTo(143,154);ctx.lineTo(108,154);ctx.fill();text(ready?'READY':'LOCKED',67,176,17,ready?'#8affbb':'#ffd49a','center');ctx.restore()}function drawPlayer(){const p=player;if(p.invuln&&frame%8<4)return;ctx.save();ctx.translate(p.x+p.w/2,p.y);ctx.scale(p.face,1);rounded(-16,44,13,24,5,'#e7efff');rounded(3,44,13,24,5,'#e7efff');rounded(-24,25,11,29,5,'#e7efff');rounded(13,25,11,29,5,'#e7efff');rounded(-20,22,40,33,11,'#f5f7ff');rounded(-10,29,20,15,4,'#69b6ea');ctx.fillStyle='#f3f7ff';ctx.beginPath();ctx.arc(0,19,24,0,7);ctx.fill();ctx.fillStyle='#547ba9';ctx.beginPath();ctx.arc(0,19,19,0,7);ctx.fill();ctx.fillStyle='#75432d';ctx.beginPath();ctx.arc(0,22,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#252029';ctx.beginPath();ctx.arc(-6,15,3,0,7);ctx.arc(5,15,3,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,23,6,.1,Math.PI-.1);ctx.stroke();ctx.restore()}function tick(){update();draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump'};window.addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='KeyR')reset()});window.addEventListener('keyup',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=false;e.preventDefault()}});window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});for(const btn of document.querySelectorAll('[data-key]')){const k=btn.dataset.key;if(k==='restart'){btn.addEventListener('click',reset);continue}const set=(v,e)=>{e.preventDefault();keys[k]=v;btn.classList.toggle('pressed',v)};btn.addEventListener('pointerdown',e=>{btn.setPointerCapture(e.pointerId);set(true,e)});btn.addEventListener('pointerup',e=>set(false,e));btn.addEventListener('pointercancel',e=>set(false,e));btn.addEventListener('lostpointercapture',()=>{keys[k]=false;btn.classList.remove('pressed')})}})();
</script><noscript>This game requires JavaScript. Open the HTML file in Safari or Chrome rather than a document preview.</noscript></body></html>
